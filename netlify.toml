# Déploiement continu du site (issue #13, specs section 7).
#
# Ce fichier est à la racine du dépôt et non dans `site/` : Netlify le
# cherche à la racine, et c'est aussi lui qui déclare où se trouve le site.

[build]
  # Le dépôt entier est cloné, mais la construction se fait depuis `site/`.
  # C'est nécessaire dans les deux sens : les commandes npm doivent tourner
  # là où vit le package.json, et le build importe les données depuis
  # `../data/` — les deux ne fonctionnent que si le clone reste complet.
  base = "site"

  # `publish` est relatif à `base`, donc `site/dist`.
  publish = "dist"

  # Enchaîne la vérification de types puis la construction (voir
  # site/package.json). Netlify installe les dépendances avant de lancer
  # cette commande.
  command = "npm run build"

[build.environment]
  # LTS active, alignée sur celle de la CI GitHub Actions : tester sur une
  # version et déployer sur une autre reviendrait à ne pas vraiment tester
  # ce qu'on met en ligne. Volontairement pas la 22 (borne d'Astro, donc la
  # plus vieille ligne encore supportée), ni une résolution automatique du
  # type "dernière LTS" qui décalerait les deux côtés à des moments
  # différents.
  NODE_VERSION = "24"

# Headers de sécurité (issue #95, audit de stabilisation) : risque réel
# faible pour ce site (statique, sans compte utilisateur ni cookie), mais
# peu coûteux à ajouter.
[[headers]]
  for = "/*"
  [headers.values]
    # `script-src`/`style-src` gardent `'unsafe-inline'` : Astro injecte des
    # `<script>` inline sans `src` pour démarrer l'hydratation des îlots
    # (`client:load`/`client:only`, vérifié dans `dist/index.html` après
    # build), et des attributs `style="--gouttiere: …px"` calculés en JS
    # (largeur de la réserve de scrollbar, `Site.svelte`/`PiedDePage.svelte`)
    # — ni l'un ni l'autre n'a de contenu fixe qu'on pourrait figer par un
    # hash SHA, un site purement statique ne peut pas générer de nonce par
    # requête. Le reste de la CSP se resserre autant que possible : seule
    # ressource tierce nécessaire, l'iframe YouTube (`Lecteur.svelte`) —
    # les polices sont auto-hébergées (Fontsource, `polices.css`), aucun
    # autre domaine à whitelister. `frame-ancestors 'none'` couvre le même
    # besoin que `X-Frame-Options` pour les navigateurs qui le supportent ;
    # gardé quand même en repli pour les autres.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.youtube.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src https://www.youtube.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
