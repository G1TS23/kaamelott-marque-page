# Note : en Analyse automatique (app GitHub, sans CI), SonarCloud ignore ce
# fichier pour la plupart des réglages — sonar.python.version se configure
# en fait depuis l'UI (Administration > General Settings > Languages >
# Python). Gardé ici comme documentation, sans effet garanti.
sonar.python.version=3.14

# Exclut les fichiers binaires committés (audio de référence pour le
# pipeline jingle, issue #5/#8) de l'analyse : sans extension reconnue comme
# binaire par le scanner, ils étaient lus comme du texte et déclenchaient un
# warning "problems with file encoding".
sonar.exclusions=data/reference_clips/**
